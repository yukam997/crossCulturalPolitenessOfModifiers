<!DOCTYPE html>
<html>

<head>
    <title>Modifier Fill-in Experiment</title>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="firebase-config.js"></script>
    <script src="stimuli.js"></script>
    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>

<body></body>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    var jsPsych = initJsPsych({
        show_progress_bar: true,
        auto_update_progress_bar: false,
        // auto_update_progress_bar increments evenly across THIS page load's
        // timeline. That's wrong once resuming is involved: after a refresh,
        // the timeline only contains the remaining trials, so the bar would
        // restart at 0% and race to 100% over a shorter distance instead of
        // reflecting overall progress. Instead we drive it manually (see
        // update_progress_bar, defined below) based on the persisted count
        // of completed trials out of the true total.
        on_trial_start: function () {
            if (typeof update_progress_bar === 'function') update_progress_bar();
        }
    });

    // Generates the code participants read off the final screen and type into
    // your form. It is also used as the Firestore document ID, so the code maps
    // directly to their document -- there is no separate lookup to maintain.
    // Uppercase only, and omits characters that are easily confused when typed
    // by hand (I, L, O, 0, 1), since participants transcribe this manually.
    function make_participant_code(len) {
        var alphabet = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        var out = '';
        if (window.crypto && window.crypto.getRandomValues) {
            var rand = new Uint32Array(len);
            window.crypto.getRandomValues(rand);
            for (var i = 0; i < len; i++) out += alphabet[rand[i] % alphabet.length];
        } else {
            for (var j = 0; j < len; j++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
        }
        return out;
    }

    // ---- Resume-on-refresh support ----
    // Everything needed to pick up where a participant left off (their ID,
    // the exact stimulus order they were assigned, and how many main trials
    // they've completed) is mirrored into localStorage as they progress.
    // If they reload the page, we read it back instead of starting over.
    var PROGRESS_KEY = 'modifier_experiment_progress_v1';

    function load_saved_progress() {
        try {
            var raw = window.localStorage.getItem(PROGRESS_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            console.warn('Could not read saved progress from localStorage.', e);
            return null;
        }
    }

    function save_progress(state) {
        try {
            window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
        } catch (e) {
            console.warn('Could not write progress to localStorage.', e);
        }
    }

    function clear_saved_progress() {
        try {
            window.localStorage.removeItem(PROGRESS_KEY);
        } catch (e) {
            // Not fatal -- worst case a finished session's leftovers linger
            // until overwritten by the next one on this browser.
        }
    }

    var url_prolific_pid = jsPsych.data.getURLVariable('PROLIFIC_PID');
    var saved_progress = load_saved_progress();

    // Only resume from a saved session if it's consistent with the current
    // URL -- e.g. if a PROLIFIC_PID is present now but the saved session was
    // for a different (or no) PID, treat this as a fresh start rather than
    // resuming someone else's progress.
    if (saved_progress && url_prolific_pid && saved_progress.prolific_pid !== url_prolific_pid) {
        saved_progress = null;
    }

    var subject_id;
    if (saved_progress) {
        subject_id = saved_progress.subject_id;
        console.log('Resuming previous session for participant', subject_id,
            '-- next trial index:', saved_progress.next_trial_index);
    } else {
        subject_id = url_prolific_pid || make_participant_code(8);
    }
    // Deliberately NOT logged here -- the code is only revealed on the final
    // screen, after the study is complete.
    jsPsych.data.addProperties({ subject_id: subject_id });

    // firebaseConfig comes from firebase-config.js (loaded above). Also make
    // sure Firestore is created and Anonymous auth is enabled in the Firebase
    // console (Authentication > Sign-in method).
    var firebaseApp = initializeApp(firebaseConfig);
    // Using a named database (not the "(default)" one) -- it must already
    // exist in the Firebase console (Firestore Database > add database)
    // before this will work.
    var db = getFirestore(firebaseApp, 'cross-cultural-politeness');
    var auth = getAuth(firebaseApp);

    // Sign in anonymously so Firestore's security rules can require auth
    // without participants ever seeing a login screen. save_data_to_firestore
    // waits on this promise before writing.
    var firebase_ready = signInAnonymously(auth).then(function (cred) {
        console.log('Firebase anonymous sign-in succeeded, uid:', cred.user.uid);
    }).catch(function (err) {
        console.error('Firebase anonymous sign-in failed:', err);
    });

    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus:
            '<p class="stimulus">この調査では、短い日本語のシナリオをいくつか読んでいただきます。' +
            'それぞれのシナリオには、＿＿＿で示された空欄があります。</p>' +
            '<p class="stimulus">シナリオの内容をよく読んだ上で、その空欄に入りうる言葉やフレーズを入力してください。' +
            '入力するたびにEnterキーを押すと、それが一つのタグとして追加されます。' +
            'いくつ追加していただいても構いません。</p>' +
            '<p class="stimulus">空欄に何も入れないでも文が成り立つと思う場合は「なし」と入力してください。</p>',
        choices: ['次へ'],
        margin_vertical: '20px'
    };

    var example_screenshot = {
        type: jsPsychHtmlButtonResponse,
        stimulus:
            '<img src="practice1_example.png?" alt="回答例のスクリーンショット" style="max-width:100%; height:auto; display:block; margin:0 auto 20px auto;">' +
            '<p class="stimulus">まずは練習として1つの例をご覧いただき、その後、本番の24個のシナリオに進みます。' +
            '正解や不正解はなく、あなたの直感的な判断に興味があります。</p>',
        choices: ['次へ'],
        margin_vertical: '20px'
    };

    // The short hint shown above the input box on every practice/main trial.
    // The fuller explanation (including the "なし" option) only appears once,
    // on the instructions page above.
    var TRIAL_HINT = '上の＿＿＿に入る言葉としてあり得るものを記入し、Enterキーを押してください。' +
        '正解や不正解はなく、入り得る言葉はいくつもあるので、思いついたものをいくつでも記入してください。';

    // Builds a single fill-in-the-blank trial. Used for both the practice
    // examples and the main stimuli, so the tag input / feedback / IME
    // handling logic lives in exactly one place.
    function make_trial(s, options) {
        options = options || {};
        var sentence_with_blank = s.text.replace('[modifier]', '<span class="blank">＿＿＿</span>');
        var collected_tags = (options.initialTags || []).slice();
        var feedback_text = '';
        var includeFeedback = options.includeFeedback !== false;

        var trial_html =
            (options.exampleLabel ? '<p class="example-label">' + options.exampleLabel + '</p>' : '') +
            '<p class="stimulus">' + sentence_with_blank + '</p>' +
            '<p class="context-note">' + TRIAL_HINT + '</p>' +
            '<div id="tag-container" class="tag-container"></div>' +
            '<input type="text" id="tag-input" class="tag-input" placeholder="言葉を入力してEnter" autocomplete="off">' +
            (includeFeedback ?
                '<p class="feedback-label">（任意）このシナリオについてのフィードバックがあればご記入ください。</p>' +
                '<textarea id="feedback-box" class="feedback-box" rows="3" placeholder="コメント（任意）"></textarea>'
                : '');

        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: trial_html,
            choices: [options.buttonLabel || 'Continue'],
            data: {
                predicate: s.predicate,
                attitude: s.attitude,
                relationship: s.relationship,
                sentence: s.text,
                is_practice: !!options.isPractice
            },
            on_load: function () {
                var input = document.getElementById('tag-input');
                var container = document.getElementById('tag-container');
                var feedback_box = includeFeedback ? document.getElementById('feedback-box') : null;
                var continue_btn = document.querySelector('.jspsych-btn');
                continue_btn.disabled = collected_tags.length === 0;
                input.focus();

                // The trial's HTML is wiped from the page as soon as the response
                // is recorded, before on_finish runs. So we track the feedback text
                // live (on every keystroke) instead of reading the DOM at the end.
                if (feedback_box) {
                    feedback_box.addEventListener('input', function () {
                        feedback_text = feedback_box.value;
                    });
                }

                function render_tags() {
                    container.innerHTML = '';
                    collected_tags.forEach(function (tag, idx) {
                        var tag_el = document.createElement('span');
                        tag_el.className = 'tag-label';
                        tag_el.textContent = tag;

                        var remove_el = document.createElement('span');
                        remove_el.className = 'tag-remove';
                        remove_el.textContent = '×';
                        remove_el.addEventListener('click', function () {
                            collected_tags.splice(idx, 1);
                            render_tags();
                            continue_btn.disabled = collected_tags.length === 0;
                        });

                        tag_el.appendChild(remove_el);
                        container.appendChild(tag_el);
                    });
                }
                render_tags();

                input.addEventListener('keydown', function (e) {
                    // Ignore Enter presses that are part of IME composition
                    // (e.g. confirming kanji conversion), not an actual submit.
                    if (e.isComposing || e.keyCode === 229) {
                        return;
                    }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        var val = input.value.trim();
                        if (val.length > 0) {
                            collected_tags.push(val);
                            input.value = '';
                            render_tags();
                            continue_btn.disabled = false;
                        }
                    }
                });
            },
            on_finish: function (data) {
                data.modifier_response = collected_tags.join('; ');
                data.modifier_response_list = collected_tags.slice();
                if (includeFeedback) {
                    data.trial_feedback = feedback_text.trim();
                }
                save_trial_to_firestore(data);
            }
        };
    }

    // The screenshot example now lives on the instructions page itself, so
    // this is the only (interactive) practice trial participants complete
    // before the main study.
    var practice_example = make_trial(
        { predicate: '', attitude: '', relationship: '', text: '山田さんは、朝から会議が続いていました。[modifier]、昼ごはんを食べる時間がありませんでした。' },
        {
            exampleLabel: '練習例',
            includeFeedback: false,
            isPractice: true,
            buttonLabel: '次へ'
        }
    );

    var ready_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: '<p class="stimulus">これから本番の実験が始まります。準備ができたら「続ける」を押してください。</p>',
        choices: ['続ける'],
        margin_vertical: '20px'
    };

    // stimuliPool (from stimuli.js) contains every predicate x attitude x relationship
    // combination. Each participant sees exactly one scenario for every
    // (relationship, attitude) pair, with the predicate for each pair chosen at
    // random. (Currently: 6 predicates x 6 attitudes x 4 relationships = 144 in the
    // pool, 4 x 6 = 24 scenarios shown per participant.)
    var relationships = Array.from(new Set(stimuliPool.map(function (s) { return s.relationship; })));
    var attitudes = Array.from(new Set(stimuliPool.map(function (s) { return s.attitude; })));
    var predicates = Array.from(new Set(stimuliPool.map(function (s) { return s.predicate; })));

    var poolIndex = {};
    stimuliPool.forEach(function (s) {
        var key = s.relationship + '|' + s.attitude + '|' + s.predicate;
        poolIndex[key] = s;
    });

    var selected_stimuli = [];
    relationships.forEach(function (rel) {
        attitudes.forEach(function (att) {
            var pred = predicates[Math.floor(Math.random() * predicates.length)];
            var key = rel + '|' + att + '|' + pred;
            var s = poolIndex[key];
            if (s) {
                selected_stimuli.push(s);
            } else {
                console.warn('Missing stimulus for', key);
            }
        });
    });

    // If a saved session exists, its selection/arrangement was already done
    // (and shown to the participant, in that exact order) before the reload.
    // Selecting and shuffling again from scratch would risk giving them a
    // different set or order than what they already started answering. So on
    // resume we skip straight to reconstructing the previous order from its
    // saved keys.
    var resumed_stimulus_keys = saved_progress ? saved_progress.stimulus_order : null;

    // Arrange trials so no two adjacent ones share a predicate or an attitude.
    // A pure random-shuffle-and-retry approach isn't reliable here (it can fail
    // to find a valid order within a reasonable number of tries), so instead we
    // greedily place whichever remaining item is currently the most "constrained"
    // (i.e. belongs to the predicate/attitude with the most items left to place),
    // with backtracking as a fallback if a dead end is ever reached.
    function arrangeAvoidingAdjacentRepeats(items, nodeLimit) {
        var remaining = items.slice();
        var result = [];
        var nodes = 0;

        function countRemaining(value, field) {
            var c = 0;
            for (var i = 0; i < remaining.length; i++) {
                if (remaining[i][field] === value) c++;
            }
            return c;
        }

        function backtrack() {
            nodes++;
            if (nodes > nodeLimit) return false;
            if (remaining.length === 0) return true;

            var last = result[result.length - 1];
            var candidates = [];
            for (var i = 0; i < remaining.length; i++) {
                var item = remaining[i];
                if (last && (item.predicate === last.predicate || item.attitude === last.attitude)) {
                    continue;
                }
                var score = countRemaining(item.predicate, 'predicate') + countRemaining(item.attitude, 'attitude');
                candidates.push({ idx: i, score: score, rand: Math.random() });
            }
            // Most-constrained-first (highest remaining count), random tiebreak.
            candidates.sort(function (a, b) {
                return (b.score - a.score) || (b.rand - a.rand);
            });

            for (var k = 0; k < candidates.length; k++) {
                var idx = candidates[k].idx;
                var candidate = remaining[idx];
                result.push(candidate);
                remaining.splice(idx, 1);
                if (backtrack()) return true;
                remaining.splice(idx, 0, candidate);
                result.pop();
            }
            return false;
        }

        var success = backtrack();
        if (!success) {
            console.warn('Could not find an order with no adjacent predicate/attitude repeats; showing best partial attempt.');
        }
        return result;
    }

    var shuffled_stimuli;
    if (resumed_stimulus_keys) {
        shuffled_stimuli = resumed_stimulus_keys.map(function (key) {
            return poolIndex[key];
        }).filter(Boolean);
    } else {
        shuffled_stimuli = arrangeAvoidingAdjacentRepeats(selected_stimuli, 200000);
    }

    console.log('shuffled_stimuli count:', shuffled_stimuli.length);
    console.log('shuffled_stimuli:', shuffled_stimuli);

    // Fixed regardless of how many resumed sessions this participant has --
    // it's the denominator for the manual progress bar.
    var TOTAL_MAIN_TRIALS = shuffled_stimuli.length;

    // How many of this participant's main trials were already completed
    // (and saved to Firestore) before this page load.
    var next_trial_index = saved_progress ? (saved_progress.next_trial_index || 0) : 0;
    if (next_trial_index > shuffled_stimuli.length) {
        next_trial_index = shuffled_stimuli.length;
    }

    function update_progress_bar() {
        var proportion = TOTAL_MAIN_TRIALS > 0 ? (next_trial_index / TOTAL_MAIN_TRIALS) : 0;
        jsPsych.setProgressBar(proportion);
    }

    // Persist (or re-persist) the current session state. Called again after
    // each trial finishes to advance next_trial_index.
    function persist_progress() {
        save_progress({
            subject_id: subject_id,
            prolific_pid: url_prolific_pid || null,
            stimulus_order: shuffled_stimuli.map(function (s) {
                return s.relationship + '|' + s.attitude + '|' + s.predicate;
            }),
            next_trial_index: next_trial_index
        });
    }
    persist_progress();

    // Only the not-yet-completed trials go into the timeline; on resume,
    // completed ones are skipped rather than re-shown.
    var remaining_stimuli = shuffled_stimuli.slice(next_trial_index);

    var trials = remaining_stimuli.map(function (s) {
        var trial = make_trial(s, { includeFeedback: true, isPractice: false });
        var original_on_finish = trial.on_finish;
        trial.on_finish = function (data) {
            original_on_finish(data);
            next_trial_index++;
            persist_progress();
            update_progress_bar();
        };
        return trial;
    });

    // One document per participant, keyed by subject_id, instead of one
    // document per trial. Every trial's on_finish (below) still saves
    // immediately as it happens -- appending to the "trials" array field on
    // this single document via arrayUnion -- so a participant who drops out
    // partway through still has whatever they've answered so far saved, but
    // all of it lives in one place instead of being scattered across many
    // documents.
    var participantDocRef = doc(db, 'responses', subject_id);

    function save_trial_to_firestore(trial_data) {
        // Logs exactly what is about to be written, so you can confirm fields
        // like trial_feedback are present and populated at write time --
        // independently of whether the write itself then succeeds.
        console.log('Saving trial -> trial_feedback:', JSON.stringify(trial_data.trial_feedback),
            '| full payload:', trial_data);
        return firebase_ready.then(function () {
            return setDoc(participantDocRef, {
                subject_id: subject_id,
                trials: arrayUnion(trial_data),
                updated_at: serverTimestamp()
            }, { merge: true });
        }).then(function () {
            console.log('Trial saved to Firestore for participant', subject_id);
        }).catch(function (err) {
            console.error('Firestore save failed for this trial.', err);
        });
    }

    // ---- Completion code screen (shown only after the study is finished) ----
    // This version does not use Prolific. Instead, the final screen reveals the
    // participant code (which is also the Firestore document ID) for the
    // participant to paste into your form. It is the last item in the timeline,
    // so it is only reachable once every trial and the debrief are done.
    var completion_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus:
            '<p class="stimulus">ご協力ありがとうございました。以下の<b>完了コード</b>をコピーし、ランサーズのフォームにご入力ください。</p>' +
            '<p id="completion-code" style="font-size:30px; font-weight:bold; letter-spacing:0.12em; ' +
            'text-align:center; font-family:monospace; background:#f1f5f9; border:1px solid #cbd5e1; ' +
            'border-radius:8px; padding:18px; margin:20px auto; max-width:420px; user-select:all;">' +
            subject_id + '</p>' +
            '<p style="text-align:center;">' +
            '<button type="button" id="copy-code" class="jspsych-btn">コードをコピー</button></p>' +
            '<p id="copy-status" class="context-note" style="text-align:center; min-height:1.6em;"></p>' +
            '<p class="context-note">このコードは、あなたのご回答を特定するために使用されます。' +
            'フォームの送信が完了するまで、この画面を閉じないでください。</p>',
        // No buttons: this is the final screen, so it stays on display.
        choices: [],
        on_load: function () {
            var btn = document.getElementById('copy-code');
            var status = document.getElementById('copy-status');
            btn.addEventListener('click', function () {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(subject_id).then(function () {
                        status.textContent = 'コピーしました。';
                    }).catch(function () {
                        status.textContent = '自動コピーができませんでした。上のコードを選択してコピーしてください。';
                    });
                } else {
                    status.textContent = '上のコードを選択してコピーしてください。';
                }
            });
        }
    };

    var debrief = {
        type: jsPsychSurveyHtmlForm,
        html: '<p>ご参加いただきありがとうございます。<br><br>' +
            'その他、お気づきの点やご意見があればご記入ください。</p>' +
            '<textarea name="comments" rows="5" cols="50"></textarea>',
        button_label: '次へ',
        on_finish: function (data) {
            var comments = data.response ? data.response.comments : '';
            // completed_at also serves as the "finished the study" marker you
            // can check when reconciling submitted codes against the database.
            firebase_ready.then(function () {
                return setDoc(participantDocRef, {
                    subject_id: subject_id,
                    comments: comments,
                    completed_at: serverTimestamp()
                }, { merge: true });
            }).then(function () {
                console.log('Debrief comments saved to Firestore for participant', subject_id);
                // The study is genuinely done at this point, so there's
                // nothing left to resume -- clear it so a stray reload on
                // this screen (or reusing the browser for a new session)
                // doesn't try to pick this participant back up.
                clear_saved_progress();
            }).catch(function (err) {
                console.error('Firestore save failed for debrief comments.', err);
            });
        }
    };

    // Someone resuming partway through has already seen the instructions,
    // example screenshot, and practice trial, so don't show those again --
    // jump straight back into the main trials. (next_trial_index === 0 also
    // covers the "never got past the intro screens" case, where showing them
    // again is harmless and expected.)
    var intro_screens = next_trial_index === 0
        ? [instructions, example_screenshot, practice_example, ready_screen]
        : [];

    var timeline = intro_screens.concat(trials, [debrief, completion_screen]);

    jsPsych.run(timeline);
</script>

</html>
